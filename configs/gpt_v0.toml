[data]
name = "shakespeare_char"
batch_size = 32
block_size = 256

[model]
name = "gpt_v0"
block_size = 256
n_layer = 6
n_head = 6
n_embd = 384
dropout = 0.2

[optim]
lr = 6e-4
min_lr = 6e-5
weight_decay = 0.1
warmup_iters = 100
lr_decay_iters = 5000
grad_clip = 1.0

[train]
max_iters = 5000
amp = "bf16"
eval_interval = 150
eval_iters = 50
log_interval = 50
seed = 1337
compile = true

[run]
name = "gpt-v0-en"
device = "cuda"
resume = "auto"
save_interval = 150

[log]
tensorboard = true
graph = true


[sample]
prompt = "\n"
max_new_tokens = 5000
temperature = 0.9
