# 单卡训练 shakespeare_char：6 层小 GPT，默认自动选卡
[data]
name = "shakespeare_char"
batch_size = 64
block_size = 256

[model]
name = "gpt"
block_size = 256
n_layer = 6
n_head = 6
n_embd = 384
dropout = 0.2

[optim]
lr = 1e-3
min_lr = 1e-4
warmup_iters = 100
lr_decay_iters = 5000

[train]
max_iters = 5000
amp = "bf16"
eval_interval = 250
eval_iters = 100
log_interval = 50

[run]
name = "shakespeare-char"
resume = "auto"
device = "cuda"

[sample]
prompt = "\nROMEO:"
max_new_tokens = 300
