# CPU 冒烟配置：小模型、40 步，一分钟内跑完
[data]
name = "shakespeare_char"
root = "data"
reader = "memmap"
batch_size = 8
block_size = 128

[model]
name = "gpt"
block_size = 128
n_layer = 2
n_head = 2
n_embd = 64

[optim]
lr = 1e-3
min_lr = 1e-4
warmup_iters = 10
lr_decay_iters = 40

[train]
max_iters = 40
amp = "none"
eval_interval = 20
eval_iters = 5
log_interval = 5

[run]
name = "debug-cpu"
resume = "auto"
device = "cpu"

[sample]
prompt = "\nROMEO:"
max_new_tokens = 60
